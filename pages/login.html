<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión · Atelier Boutique</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#0a0a0a', accent: '#c9a961', cream: '#faf7f2' },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'], serif: ['Playfair Display','Georgia','serif'] }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/styles.css">
<meta name="currency" content="CLP">
</head>
<body class="bg-cream">

  <div id="navbar-root"></div>

  <main class="min-h-[calc(100vh-200px)] flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-6">
        <a href="../index.html" class="inline-block text-3xl font-serif font-bold text-primary mb-2">
          ATELIER<span class="text-accent">.</span>
        </a>
        <h1 class="font-serif text-2xl mt-3">Bienvenido de vuelta</h1>
        <p class="text-text-light text-sm mt-1">Ingresa a tu cuenta para continuar</p>
      </div>

      <div class="bg-white rounded-lg shadow-sm p-8">
        <form id="loginForm" class="space-y-4">
          <div class="form-group">
            <label class="label" for="email">Email</label>
            <input type="email" id="email" name="email" required class="input" placeholder="tu@email.com" autocomplete="email">
          </div>
          <div class="form-group">
            <div class="flex justify-between items-center mb-2">
              <label class="label mb-0" for="password">Contraseña</label>
              <a href="recuperar-password.html" class="text-xs text-accent hover:underline">¿Olvidaste tu contraseña?</a>
            </div>
            <input type="password" id="password" name="password" required class="input" placeholder="••••••••" autocomplete="current-password">
          </div>
          <div class="flex items-center">
            <input type="checkbox" id="remember" class="accent-accent">
            <label for="remember" class="ml-2 text-sm text-text-light cursor-pointer">Recordarme</label>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Iniciar Sesión</button>
        </form>

        <div class="my-6 flex items-center gap-3">
          <div class="flex-1 h-px bg-border"></div>
          <span class="text-xs text-text-light uppercase">o</span>
          <div class="flex-1 h-px bg-border"></div>
        </div>

        <button class="btn btn-outline btn-block mb-2">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continuar con Google
        </button>
      </div>

      <p class="text-center text-sm mt-6 text-text-light">
        ¿No tienes cuenta? <a href="registro.html" class="text-accent font-medium hover:underline">Crear cuenta</a>
      </p>

      <div class="mt-6 p-4 bg-accent/10 border border-accent/30 rounded-lg text-xs">
        <p class="font-medium mb-1">🎯 Cuenta demo disponible:</p>
        <p>Email: <strong>demo@atelier.cl</strong></p>
        <p>Contraseña: <strong>123456</strong></p>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/orders.js"></script>
  <script src="../assets/js/reviews.js"></script>
  <script>
    initMockData();
    UI.mountNavbar('');
    UI.mountFooter();
    Cart.init();

    const nextUrl = UI.getQueryParam('next');

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      const result = Auth.login(email, password, remember);
      if (result.success) {
        UI.toast(`Bienvenido/a ${result.user.name}`, "success");
        setTimeout(() => {
          location.href = nextUrl || "../index.html";
        }, 800);
      } else {
        UI.toast(result.error, "error");
      }
    });
  </script>

</body>
</html>
