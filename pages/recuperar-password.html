<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Contraseña · Atelier Boutique</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#0a0a0a', accent: '#c9a961', cream: '#faf7f2' },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'], serif: ['Playfair Display','Georgia','serif'] }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/styles.css">
<meta name="currency" content="CLP">
</head>
<body class="bg-cream">

  <div id="navbar-root"></div>

  <main class="min-h-[calc(100vh-200px)] flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
      <div class="text-center mb-6">
        <a href="../index.html" class="inline-block text-3xl font-serif font-bold text-primary mb-2">
          ATELIER<span class="text-accent">.</span>
        </a>
        <h1 class="font-serif text-2xl mt-3">Recuperar contraseña</h1>
        <p class="text-text-light text-sm mt-1">Te enviaremos un enlace para restablecerla</p>
      </div>

      <div id="cardContainer" class="bg-white rounded-lg shadow-sm p-8">
        <div class="text-center mb-6">
          <div class="w-16 h-16 mx-auto bg-accent/10 rounded-full flex items-center justify-center mb-3">
            <svg width="32" height="32" fill="none" stroke="#c9a961" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <p class="text-sm text-text-light">Ingresa el email asociado a tu cuenta y te enviaremos las instrucciones.</p>
        </div>

        <form id="resetForm" class="space-y-4">
          <div class="form-group">
            <label class="label" for="email">Email</label>
            <input type="email" id="email" name="email" required class="input" placeholder="tu@email.com">
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Enviar enlace de recuperación</button>
        </form>

        <p class="text-center text-sm mt-6 text-text-light">
          <a href="login.html" class="text-accent font-medium hover:underline">← Volver a iniciar sesión</a>
        </p>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/orders.js"></script>
  <script src="../assets/js/reviews.js"></script>
  <script>
    initMockData();
    UI.mountNavbar('');
    UI.mountFooter();
    Cart.init();

    document.getElementById('resetForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      Auth.requestPasswordReset(email);

      // Simular envío
      const btn = e.target.querySelector('button');
      btn.disabled = true;
      btn.innerHTML = '<svg class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3"/><path d="M12 2a10 10 0 0 1 10 10" fill="currentColor"/></svg> Enviando...';

      setTimeout(() => {
        document.getElementById('cardContainer').innerHTML = `
          <div class="text-center py-6">
            <div class="w-16 h-16 mx-auto bg-green-100 rounded-full flex items-center justify-center mb-4">
              <svg width="32" height="32" fill="none" stroke="#2d6a4f" stroke-width="2.5" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>
            </div>
            <h2 class="font-serif text-2xl mb-2">¡Revisa tu email!</h2>
            <p class="text-text-light mb-4">Si la dirección <strong>${email}</strong> está registrada, te enviamos un enlace para restablecer tu contraseña.</p>
            <p class="text-xs text-text-light mb-6">Si no recibes el email en unos minutos, revisa tu carpeta de spam.</p>
            <a href="login.html" class="btn btn-primary btn-block">Volver a iniciar sesión</a>
          </div>
        `;
      }, 1500);
    });
  </script>

</body>
</html>
