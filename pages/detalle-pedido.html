<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle del Pedido · Atelier Boutique</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#0a0a0a', accent: '#c9a961', cream: '#faf7f2' },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'], serif: ['Playfair Display','Georgia','serif'] }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

  <div id="navbar-root"></div>

  <main class="bg-cream py-8">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
      <div id="content"></div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/orders.js"></script>
  <script src="../assets/js/reviews.js"></script>
  <script>
    initMockData();
    UI.mountNavbar('');
    UI.mountFooter();
    Cart.init();

    const orderId = UI.getQueryParam('id');
    const order = Orders.getById(orderId);

    if (!order) {
      document.getElementById('content').innerHTML = `
        <div class="bg-white rounded-lg p-12 text-center">
          <h1 class="font-serif text-3xl mb-3">Pedido no encontrado</h1>
          <p class="text-text-light mb-6">No encontramos este pedido.</p>
          <a href="perfil.html" class="btn btn-primary">Ver mis pedidos</a>
        </div>
      `;
    } else {
      const user = Auth.getCurrentUser();
      const canSee = !user || (order.userId === user.id) || order.guest;

      if (!canSee) {
        document.getElementById('content').innerHTML = `
          <div class="bg-white rounded-lg p-12 text-center">
            <h1 class="font-serif text-3xl mb-3">Sin permisos</h1>
            <p class="text-text-light mb-6">No tienes acceso a este pedido.</p>
            <a href="perfil.html" class="btn btn-primary">Volver</a>
          </div>
        `;
      } else {
        const flowIdx = ORDER_STATUS_FLOW.findIndex(s => s.key === order.status);
        const flow = ORDER_STATUS_FLOW.map((step, i) => ({
          ...step,
          completed: i <= flowIdx && order.status !== 'cancelado',
          active: i === flowIdx && order.status !== 'cancelado'
        }));

        document.getElementById('content').innerHTML = `
          <a href="perfil.html" class="text-sm text-accent hover:underline mb-4 inline-block">← Volver a mis pedidos</a>

          <!-- Header -->
          <div class="bg-white rounded-lg p-6 mb-6">
            <div class="flex flex-wrap justify-between items-start gap-4 mb-4">
              <div>
                <p class="text-sm text-text-light">Pedido</p>
                <h1 class="font-serif text-2xl">${order.id}</h1>
                <p class="text-sm text-text-light mt-1">Realizado el ${UI.formatDate(order.createdAt)}</p>
              </div>
              <div class="text-right">
                <span class="status-badge ${Orders.getStatusClass(order.status)}">${Orders.getStatusLabel(order.status)}</span>
                <p class="text-sm text-text-light mt-2">Total: <strong class="text-primary text-lg">${UI.formatCLP(order.total)}</strong></p>
              </div>
            </div>

            <!-- Timeline -->
            <div class="border-t border-border pt-6">
              <h3 class="label">Estado del envío</h3>
              <div class="timeline mt-4">
                ${flow.map(step => `
                  <div class="timeline-step ${step.completed ? 'completed' : ''} ${step.active ? 'active' : ''}">
                    <div class="timeline-dot">
                      ${step.completed ? '<svg width="12" height="12" fill="none" stroke="white" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>' : ''}
                    </div>
                    <div>
                      <p class="font-medium">${step.label}</p>
                      <p class="text-xs text-text-light">${step.description}</p>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>

          <!-- Items -->
          <div class="bg-white rounded-lg p-6 mb-6">
            <h2 class="font-serif text-xl mb-4">Productos</h2>
            <div class="space-y-4">
              ${order.items.map(item => `
                <div class="flex flex-col md:flex-row gap-4 pb-4 border-b border-border last:border-0">
                  <img src="${item.image}" alt="${item.name}" class="w-full md:w-24 h-32 md:h-28 object-cover rounded">
                  <div class="flex-1">
                    <a href="detalle-producto.html?id=${item.productId}" class="font-medium hover:text-accent">${item.name}</a>
                    <p class="text-sm text-text-light mt-1">${item.color} · Talle ${item.size} · Cantidad ${item.qty}</p>
                    <p class="text-sm font-semibold mt-2">${UI.formatCLP(item.price * item.qty)}</p>
                  </div>
                  <div class="flex md:flex-col gap-2">
                    <a href="detalle-producto.html?id=${item.productId}" class="btn btn-outline btn-sm">Ver producto</a>
                    ${user && Reviews.userHasPurchased(item.productId) && !Reviews.hasReviewed(item.productId) ? `
                      <a href="resena.html?productId=${item.productId}" class="btn btn-accent btn-sm">Reseñar</a>
                    ` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Detalles envío y pago -->
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white rounded-lg p-6">
              <h3 class="font-serif text-lg mb-3">Dirección de envío</h3>
              <p class="text-sm">${order.shipping.address}</p>
              <p class="text-sm">${order.shipping.city}, ${order.shipping.region}</p>
              ${order.shipping.zip ? `<p class="text-sm">CP: ${order.shipping.zip}</p>` : ''}
              <div class="mt-4 pt-4 border-t border-border">
                <p class="text-xs uppercase tracking-wider text-text-light">Método</p>
                <p class="text-sm font-medium">${order.shipping.typeName}</p>
              </div>
            </div>
            <div class="bg-white rounded-lg p-6">
              <h3 class="font-serif text-lg mb-3">Resumen del pago</h3>
              <div class="space-y-2 text-sm">
                <div class="flex justify-between"><span class="text-text-light">Subtotal</span><span>${UI.formatCLP(order.subtotal)}</span></div>
                <div class="flex justify-between"><span class="text-text-light">Envío</span><span>${order.shippingCost === 0 ? 'GRATIS' : UI.formatCLP(order.shippingCost)}</span></div>
                <div class="flex justify-between font-semibold pt-2 border-t border-border text-base">
                  <span>Total</span><span>${UI.formatCLP(order.total)}</span>
                </div>
              </div>
              <div class="mt-4 pt-4 border-t border-border">
                <p class="text-xs uppercase tracking-wider text-text-light">Pagado con</p>
                <p class="text-sm font-medium">${order.payment.methodName}</p>
                ${order.payment.last4 ? `<p class="text-xs text-text-light">**** **** **** ${order.payment.last4}</p>` : ''}
              </div>
            </div>
          </div>

          <!-- Acciones -->
          <div class="flex flex-wrap gap-3 mt-6 justify-center">
            <button onclick="window.print()" class="btn btn-outline">
              <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg>
              Imprimir
            </button>
            <a href="seguimiento.html" class="btn btn-outline">Seguir mi pedido</a>
            <a href="contacto.html" class="btn btn-outline">Necesito ayuda</a>
          </div>
        `;
      }
    }
  </script>

</body>
</html>
