<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrito · Atelier Boutique</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#0a0a0a', accent: '#c9a961', cream: '#faf7f2' },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'], serif: ['Playfair Display','Georgia','serif'] }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/styles.css">
<meta name="currency" content="CLP">
</head>
<body>

  <div id="navbar-root"></div>

  <section class="bg-primary text-white py-12">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
      <p class="uppercase tracking-widest text-sm text-accent mb-3">Tu selección</p>
      <h1 class="font-serif text-4xl md:text-5xl">Carrito de Compras</h1>
    </div>
  </section>

  <section class="section-sm bg-cream">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div id="content"></div>
    </div>
  </section>

  <div id="footer-root"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/orders.js"></script>
  <script src="../assets/js/reviews.js"></script>
  <script>
    initMockData();
    UI.mountNavbar('productos');
    UI.mountFooter();
    Cart.init();

    const SHIPPING_FREE_THRESHOLD = 50000;
    const SHIPPING_STANDARD = 3990;

    function render() {
      const items = Cart.getDetailedItems();
      const subtotal = Cart.subtotal();
      const shippingCost = subtotal >= SHIPPING_FREE_THRESHOLD ? 0 : SHIPPING_STANDARD;
      const total = subtotal + shippingCost;
      const remaining = Math.max(0, SHIPPING_FREE_THRESHOLD - subtotal);
      const progress = Math.min(100, (subtotal / SHIPPING_FREE_THRESHOLD) * 100);

      const content = document.getElementById('content');

      if (items.length === 0) {
        content.innerHTML = `
          <div class="bg-white rounded-lg p-12 text-center">
            <svg width="80" height="80" fill="none" stroke="#c9a961" stroke-width="1.5" viewBox="0 0 24 24" class="mx-auto mb-4">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <h2 class="font-serif text-2xl mb-2">Tu carrito está vacío</h2>
            <p class="text-text-light mb-6">Descubre nuestras colecciones y encuentra tu próximo favorito.</p>
            <a href="productos.html" class="btn btn-primary">Explorar catálogo</a>
          </div>
        `;
        return;
      }

      content.innerHTML = `
        <!-- Barra progreso envío gratis -->
        ${remaining > 0 ? `
          <div class="bg-accent/10 border border-accent/30 rounded-lg p-4 mb-6">
            <p class="text-sm mb-2">¡Te faltan <strong>${UI.formatCLP(remaining)}</strong> para envío gratis!</p>
            <div class="h-2 bg-white rounded overflow-hidden">
              <div class="h-full bg-accent transition-all" style="width: ${progress}%"></div>
            </div>
          </div>
        ` : `
          <div class="bg-green-50 border border-green-200 text-green-700 rounded-lg p-4 mb-6 text-center">
            ✓ ¡Felicitaciones! Tienes envío gratis.
          </div>
        `}

        <div class="grid grid-cols-1 lg:grid-cols-[1fr_380px] gap-6">
          <!-- Lista items -->
          <div class="bg-white rounded-lg overflow-hidden">
            <div class="hidden md:grid grid-cols-[100px_1fr_auto_auto_auto] gap-4 p-4 border-b border-border text-xs uppercase tracking-wider text-text-light">
              <div></div>
              <div>Producto</div>
              <div>Precio</div>
              <div>Cantidad</div>
              <div>Subtotal</div>
            </div>
            <div id="itemsList">
              ${items.map((item, idx) => `
                <div class="grid grid-cols-[80px_1fr] md:grid-cols-[100px_1fr_auto_auto_auto] gap-4 p-4 border-b border-border items-center" data-idx="${idx}">
                  <a href="detalle-producto.html?id=${item.productId}" class="block">
                    <img src="${item.product.images[0]}" alt="${item.product.name}" class="w-20 h-24 md:w-24 md:h-28 object-cover rounded">
                  </a>
                  <div class="md:order-1 col-span-2 md:col-span-1">
                    <a href="detalle-producto.html?id=${item.productId}" class="font-medium hover:text-accent">${item.product.name}</a>
                    <p class="text-xs text-text-light mt-1">${item.color} · Talle ${item.size}</p>
                    <button class="text-xs text-error mt-2 md:hidden" onclick="window.removeItem(${idx})">Eliminar</button>
                  </div>
                  <div class="md:order-2 col-span-2 md:col-span-1 flex md:block justify-between items-center">
                    <span class="text-xs text-text-light md:hidden">Precio:</span>
                    <span class="text-sm font-medium">${UI.formatCLP(item.product.price)}</span>
                  </div>
                  <div class="md:order-3 col-span-2 md:col-span-1 flex md:block justify-between items-center">
                    <span class="text-xs text-text-light md:hidden">Cantidad:</span>
                    <div class="qty-selector">
                      <button class="qty-btn" onclick="window.updateQty(${idx}, ${item.qty - 1})">−</button>
                      <input type="text" class="qty-input" value="${item.qty}" readonly>
                      <button class="qty-btn" onclick="window.updateQty(${idx}, ${item.qty + 1})">+</button>
                    </div>
                  </div>
                  <div class="md:order-4 col-span-2 md:col-span-1 flex md:block justify-between items-center">
                    <span class="text-xs text-text-light md:hidden">Subtotal:</span>
                    <span class="font-semibold">${UI.formatCLP(item.product.price * item.qty)}</span>
                  </div>
                  <button class="hidden md:block text-text-light hover:text-error transition" onclick="window.removeItem(${idx})" title="Eliminar">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                  </button>
                </div>
              `).join('')}
            </div>
            <div class="p-4 flex justify-between items-center">
              <a href="productos.html" class="text-sm text-accent hover:underline">← Seguir comprando</a>
              <button onclick="window.clearAll()" class="text-sm text-text-light hover:text-error">Vaciar carrito</button>
            </div>
          </div>

          <!-- Resumen -->
          <aside class="bg-white rounded-lg p-6 h-fit sticky top-32">
            <h3 class="font-serif text-xl mb-4">Resumen</h3>
            <div class="space-y-3 text-sm pb-4 border-b border-border">
              <div class="flex justify-between"><span class="text-text-light">Subtotal</span><span>${UI.formatCLP(subtotal)}</span></div>
              <div class="flex justify-between">
                <span class="text-text-light">Envío</span>
                <span class="${shippingCost === 0 ? 'text-green-600 font-medium' : ''}">${shippingCost === 0 ? 'GRATIS' : UI.formatCLP(shippingCost)}</span>
              </div>
            </div>
            <div class="flex justify-between items-baseline py-4 text-lg font-semibold">
              <span>Total</span>
              <span>${UI.formatCLP(total)}</span>
            </div>
            <button onclick="window.checkout()" class="btn btn-primary btn-block btn-lg mb-2">
              Proceder al pago
            </button>
            <button onclick="window.checkoutAsGuest()" class="btn btn-outline btn-block btn-sm">
              Comprar como invitado
            </button>
            <div class="mt-6 space-y-2 text-xs text-text-light">
              <p>✓ Envío gratis sobre ${UI.formatCLP(SHIPPING_FREE_THRESHOLD)}</p>
              <p>✓ Hasta 6 cuotas sin interés</p>
              <p>✓ Compra 100% segura</p>
            </div>
          </aside>
        </div>
      `;
    }

    window.updateQty = function(idx, qty) {
      Cart.updateQty(idx, qty);
      render();
    };

    window.removeItem = async function(idx) {
      const ok = await UI.confirmDialog("¿Eliminar este producto del carrito?", "Eliminar producto");
      if (ok) {
        Cart.remove(idx);
        UI.toast("Producto eliminado", "info");
        render();
      }
    };

    window.clearAll = async function() {
      const ok = await UI.confirmDialog("¿Vaciar todo el carrito?", "Vaciar carrito");
      if (ok) {
        Cart.clear();
        UI.toast("Carrito vaciado", "info");
        render();
      }
    };

    window.checkout = function() {
      if (!Auth.getCurrentUser()) {
        UI.toast("Inicia sesión para continuar", "info");
        setTimeout(() => location.href = "login.html?next=" + encodeURIComponent("checkout.html"), 700);
      } else {
        location.href = "checkout.html";
      }
    };

    window.checkoutAsGuest = function() {
      location.href = "checkout.html?guest=1";
    };

    render();
  </script>

</body>
</html>
