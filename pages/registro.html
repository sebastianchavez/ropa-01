<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta · Atelier Boutique</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#0a0a0a', accent: '#c9a961', cream: '#faf7f2' },
          fontFamily: { sans: ['Inter','system-ui','sans-serif'], serif: ['Playfair Display','Georgia','serif'] }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body class="bg-cream">

  <div id="navbar-root"></div>

  <main class="min-h-[calc(100vh-200px)] flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-lg">
      <div class="text-center mb-6">
        <a href="../index.html" class="inline-block text-3xl font-serif font-bold text-primary mb-2">
          ATELIER<span class="text-accent">.</span>
        </a>
        <h1 class="font-serif text-2xl mt-3">Crear cuenta</h1>
        <p class="text-text-light text-sm mt-1">Únete y disfruta beneficios exclusivos</p>
      </div>

      <div class="bg-white rounded-lg shadow-sm p-8">
        <form id="registerForm" class="space-y-4">
          <div class="form-group">
            <label class="label" for="name">Nombre completo</label>
            <input type="text" id="name" name="name" required class="input" placeholder="Tu nombre" autocomplete="name">
          </div>
          <div class="form-group">
            <label class="label" for="email">Email</label>
            <input type="email" id="email" name="email" required class="input" placeholder="tu@email.com" autocomplete="email">
          </div>
          <div class="form-group">
            <label class="label" for="phone">Teléfono (opcional)</label>
            <input type="tel" id="phone" name="phone" class="input" placeholder="+56 9 XXXX XXXX" autocomplete="tel">
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="form-group">
              <label class="label" for="password">Contraseña</label>
              <input type="password" id="password" name="password" required minlength="6" class="input" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
              <p class="text-xs text-text-light mt-1">Mínimo 6 caracteres</p>
            </div>
            <div class="form-group">
              <label class="label" for="confirmPassword">Confirmar</label>
              <input type="password" id="confirmPassword" name="confirmPassword" required class="input" placeholder="Repetir contraseña" autocomplete="new-password">
            </div>
          </div>
          <div class="flex items-start">
            <input type="checkbox" id="terms" required class="accent-accent mt-1">
            <label for="terms" class="ml-2 text-sm text-text-light cursor-pointer">
              Acepto los <a href="terminos.html" target="_blank" class="text-accent hover:underline">términos y condiciones</a> y la <a href="politicas-privacidad.html" target="_blank" class="text-accent hover:underline">política de privacidad</a>.
            </label>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg">Crear cuenta</button>
        </form>

        <p class="text-center text-sm mt-6 text-text-light">
          ¿Ya tienes cuenta? <a href="login.html" class="text-accent font-medium hover:underline">Iniciar sesión</a>
        </p>
      </div>
    </div>
  </main>

  <div id="footer-root"></div>

  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/ui.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/cart.js"></script>
  <script src="../assets/js/orders.js"></script>
  <script src="../assets/js/reviews.js"></script>
  <script>
    initMockData();
    UI.mountNavbar('');
    UI.mountFooter();
    Cart.init();

    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const phone = document.getElementById('phone').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirmPassword').value;

      if (password !== confirm) {
        UI.toast("Las contraseñas no coinciden", "error");
        return;
      }

      const result = Auth.register({ name, email, password, phone });
      if (result.success) {
        UI.toast(`¡Bienvenido/a ${result.user.name}!`, "success");
        setTimeout(() => location.href = "../index.html", 1000);
      } else {
        UI.toast(result.error, "error");
      }
    });
  </script>

</body>
</html>
